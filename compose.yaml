
services:
###> doctrine/doctrine-bundle ###
  # PostgreSQL xizmati — faqat loyihani PostgreSQL bilan ishlatganda kerak
  # Standart konfiguratsiya SQLite dan foydalanadi — bu servisni ishga tushirish shart emas
  # PostgreSQL bilan ishlash uchun: compose up -d database → soʻng .env.local da DATABASE_URL ni oʻzgartiring
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
